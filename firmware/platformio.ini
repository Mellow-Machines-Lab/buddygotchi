; Boop firmware: Boop's app in src/, on LinkKit's device
; library (../linkkit/device, linked in by lib_deps below; it checks it never
; includes Boop's headers). Build through tools/pio.sh, which keeps
; PlatformIO's packages inside this checkout:
;   firmware/tools/pio.sh run -e amoled206    (or `make -C internal fw`)
;   firmware/tools/pio.sh test -e native      (or `make -C internal fw-test`)
[platformio]
default_envs = amoled206
; The unit tests and the simulator are internal (internal/README.md).
; The engine's test suites and the chosen pack's, which
; characters/charactergen.py --stage links in here (characters/CHARACTER.md §2).
test_dir = ../.character-build/firmware-test

; What the board builds with, beside its own BOOP_BOARD_* (src/board/config.h).
[common]
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -Iassets
    -I../.character-build/firmware/include
    -I../.character-build/firmware/src

; Waveshare ESP32-S3-Touch-AMOLED-2.06 (ESP32-S3, 32 MB flash, 8 MB octal
; PSRAM): its screen, touch and sound in src/board/amoled206/. USB is the
; S3's own (USB-Serial/JTAG, /dev/cu.usbmodem*).
;   firmware/tools/pio.sh run -e amoled206 -t upload
[env:amoled206]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 460800
upload_speed = 921600
; The board's name in a character pack's `faces`: tools/pack_face.py builds
; the staged pack's firmware, with the face it names for the board.
custom_board = amoled206
; The native gel shades a full RGB565 surface every frame (-O2 below), and
; its engine's step builds for size (tools/engine_for_size.py).
build_unflags = -Os
extra_scripts =
    pre:tools/version.py
    pre:tools/engine_for_size.py
    pre:tools/pack_face.py
build_flags =
    ${common.build_flags}
    -DBOOP_BOARD_AMOLED206
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; The board builds board/, which is shared, and its own folder (not
; board/hosted/ or board/mirror/, the boards with no hardware); the staged
; pack's firmware comes in through tools/pack_face.py.
build_src_filter = +<board/> -<board/hosted/> -<board/mirror/> +<render/> +<app/> +<voice/> +<main.cpp>
; Exact versions, so every build is the same; bump them on purpose.
lib_deps =
    symlink://../linkkit/device
    lovyan03/LovyanGFX @ 1.2.32
    bblanchon/ArduinoJson @ 7.4.3
    h2zero/NimBLE-Arduino @ 2.5.1

; The AMOLED build that prints BOOP_GEL_PROFILE's one-second timing lines on
; USB: diagnostic text beside the link's JSON, so for
; measuring only, never the everyday build.
;   firmware/tools/pio.sh run -e amoled206_profile -t upload
[env:amoled206_profile]
extends = env:amoled206
build_flags =
    ${env:amoled206.build_flags}
    -DBOOP_GEL_PROFILE

; The board with no hardware (src/board/hosted/) and the firmware's
; portable code it runs: what the native env builds below, and what
; tools/wasm.sh reads here to build it to WebAssembly for the simulator's
; page and the Mac's mirror of the board.
[hosted]
src_filter = +<render/> +<app/> +<voice/> +<board/hosted/>

; The Mac: firmware unit tests and the native simulator build. Only the pure
; C++ parts build here: the hosted board and what it runs ([hosted]),
; LinkKit without its Bluetooth, the simulator's core on it from
; simulator/core/ (the filter is relative to src/), and the staged pack's
; firmware, every face of it (tools/pack_face.py).
[env:native]
platform = native
extra_scripts = pre:tools/pack_face.py
build_flags =
    -std=c++17
    -Isrc
    -Iassets
    -I../internal/firmware
    -I../.character-build/firmware/include
    -I../.character-build/firmware/src
build_src_filter = ${hosted.src_filter} +<../../simulator/core/>
test_build_src = yes
lib_deps =
    symlink://../linkkit/device
    bblanchon/ArduinoJson @ 7.4.3
