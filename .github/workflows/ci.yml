# The checks anyone can run without a board, a key or Bluetooth
# (internal/VERIFICATION.md L0 and L1): Boop's Swift tests and the
# packages', the Python tests that need only the standard library, then
# the firmware's and LinkKit's device tests on the Mac, and the Mac's
# mirror of the board against the simulator (with no Emscripten here, the
# mirror checked in, not built again),
# all as Boop, the default pack, and the boards' firmware: the CYD's with
# Pixel and the AMOLED's with Boop's gel face, so each pack builds.
#
# Package.swift needs Swift 6.2 or later. Boop is developed with Swift 6.4,
# and the newest runner has Xcode 26.6's, which is older, so code here has
# to compile on both. A failure's errors and failed tests also show as
# annotations on the run, readable without signing in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    name: Swift tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: true  # agent-hooks/ and mellowharness/
      - run: swift --version
      - name: Build, then Boop's tests and each package's
        run: |
          set -o pipefail
          make -C internal test 2>&1 | tee test.log
      - name: Show the errors
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "error:|✘|FAIL|failed" | sort -u | head -20 |
            while IFS= read -r line; do echo "::error title=Swift tests::$line"; done

  python:
    name: Python tests
    # The tests that need only the standard library, on the Mac's own
    # Python (3.9), which the build's scripts are kept to. boopctl's need
    # its venv, the webcam recorder's build a Swift fixture, and the
    # simulator's need PlatformIO, Emscripten and Node, so they're left out.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: /usr/bin/python3 --version
      - name: Every pack checks out (its moods, what it uses, its studio entry)
        run: /usr/bin/python3 characters/charactergen.py --check
      - name: charactergen's tests
        run: /usr/bin/python3 -m unittest discover -s internal/characters
      - name: The demo session's tests
        run: /usr/bin/python3 -m unittest discover -s internal/tools/session/tests
      - name: Each pack's tool tests
        run: |
          for tests in characters/*/tests/tools; do
            [ -d "$tests" ] || continue
            /usr/bin/python3 -m unittest discover -s "$tests" || exit 1
          done

  firmware:
    name: Firmware tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: firmware/.platformio-core
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'linkkit/device/platformio.ini') }}
      - name: Boop's firmware tests, then LinkKit's device tests
        run: make -C internal fw-test
      - name: The Mac's mirror of the board, its page and every gel scenario's shots against the simulator
        run: |
          node --test characters/boop/tests/mirror/page.test.mjs
          internal/tools/boopctl mirror

  boards:
    name: Board builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: firmware/.platformio-core
          key: pio-boards-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'linkkit/device/platformio.ini') }}
      - name: The CYD's firmware, with Pixel
        run: CHARACTER=pixel firmware/tools/pio.sh run -e cyd24
      - name: The AMOLED's firmware, with Boop's gel face
        run: CHARACTER=boop firmware/tools/pio.sh run -e amoled206
